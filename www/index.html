<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kyrinMedia</title>
    <style>
      body { margin: 0; display: flex; height: 100vh; align-items: center; justify-content: center;
             background: #000; color: #888; font-family: sans-serif; }
      .splash { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      /* 两张同一张 logo 上下叠放：下层暗淡线稿，上层全彩线稿自下而上揭示（涨水动效，加载中循环） */
      .logo-wrap { position: relative; width: min(52vw, 208px); aspect-ratio: 1; }
      .logo-wrap img { display: block; width: 100%; height: 100%; }
      .logo-base { opacity: .25; }
      .logo-fill { position: absolute; inset: 0; clip-path: inset(100% 0 0 0);
                   animation: rise 1.2s ease-in-out infinite alternate; }
      @keyframes rise { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
      .brand { color: #e0f2fe; font-size: 22px; font-weight: 700; letter-spacing: .12em; }
      .bar { width: min(60vw, 220px); height: 4px; border-radius: 999px; background: #0c4a6e; overflow: hidden; }
      .bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: #0ea5e9;
                 animation: load 1.4s ease-out forwards; }
      @keyframes load { to { width: 100%; } }
      .hint { font-size: 13px; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo-wrap">
        <img class="logo-base" src="logo.png" alt="" />
        <img class="logo-fill" src="logo.png" alt="kyrinMedia" />
      </div>
      <div class="brand">kyrinMedia</div>
      <div class="bar"><i></i></div>
      <div class="hint">加载中…</div>
    </div>
    <script>
      // 正常情况下 Capacitor 会直接加载 capacitor.config.ts 里配置的线上站，
      // 这个页面只是 webDir 占位，几乎不会被看到。
      setTimeout(function () {
        location.href = 'https://moontv.hookjune.qzz.io';
      }, 1500);
    </script>
  </body>
</html>
